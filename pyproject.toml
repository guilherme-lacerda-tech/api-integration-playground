[project]
name = "api-integration-playground"
version = "0.2.0"
description = "Synthetic API integration playground with auth, pagination, retry and cache patterns."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
